<div class="login-container">
  <div class="login-wrapper">
    <h2 style="text-align: center;">Client Management System</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-container">
      <!-- Email Field -->
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" />
        <mat-error *ngIf="email?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="email?.hasError('email')">Enter a valid email address</mat-error>
      </mat-form-field>

      <!-- Password Field -->
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" />
        <mat-error *ngIf="password?.hasError('required')">Password is required</mat-error>
        <mat-error *ngIf="password?.hasError('minlength')">Min 8 characters</mat-error>
        <mat-error *ngIf="password?.hasError('pattern')">Include uppercase, lowercase, number, and special character</mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="loginForm.invalid"
        class="submit-btn"
      >
        Login
      </button>
    </form>
  </div>
</div>
